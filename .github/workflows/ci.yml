name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: arcade_test
          POSTGRES_USER: arcade_test
          POSTGRES_PASSWORD: arcade_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arcade_test -d arcade_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: "4000"
      DATABASE_URL: postgresql://arcade_test:arcade_test_password@127.0.0.1:5432/arcade_test?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-only-jwt-secret-at-least-thirty-two-characters
      ALLOW_DEMO_OTP: "true"
      ENABLE_DEMO_LOGIN: "false"
      TEST_OTP: "654321"
      ADMIN_PHONE: "9999999999"
      ADMIN_PASSWORD: ci-only-admin-password
      AGENT_PHONE: "8888888881"
      AGENT_PASSWORD: ci-only-agent-password
      CORS_ORIGINS: http://127.0.0.1:4173,http://127.0.0.1:4174,http://127.0.0.1:4175,http://127.0.0.1:4176

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm run scan:secrets
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run audit:deps
      - run: npm run build
      - name: Apply disposable database migrations
        run: npx prisma migrate deploy --schema apps/backend/prisma/schema.prisma
      - name: Run API integration flow
        run: |
          node apps/backend/dist/server.js > /tmp/arcade-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4000/api/v1/health >/dev/null; then
              break
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat /tmp/arcade-api.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4000/api/v1/health >/dev/null || {
            cat /tmp/arcade-api.log
            exit 1
          }
          npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
databases:
  - name: apex-arcade-db
    databaseName: arcade_db
    user: arcade_user
    plan: free
    region: oregon

services:
  - type: keyvalue
    name: apex-arcade-redis
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: apex-arcade-api
    runtime: node
    plan: free
    region: oregon
    autoDeployTrigger: commit
    buildCommand: npm ci --include=dev && npm --workspace=packages/shared-types run build && npm --workspace=packages/shared-utils run build && npx --workspace=apps/backend prisma generate && npm --workspace=apps/backend run build
    # Free web services do not support preDeployCommand, so migrations run before the server starts.
    startCommand: npx prisma migrate deploy --schema apps/backend/prisma/schema.prisma && node apps/backend/dist/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: NODE_ENV
        value: production
      - key: DEPLOY_ENV
        value: staging
      - key: ALLOW_DEMO_OTP
        value: "false"
      - key: ENABLE_DEMO_LOGIN
        value: "false"
      - key: ENABLE_REGULATED_FEATURES
        value: "false"
      - key: SMS_PROVIDER
        sync: false
      - key: FAST2SMS_API_KEY
        sync: false
      - key: MSG91_AUTH_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://apex-web-landing-o6u0.onrender.com,https://apex-mobile-app.onrender.com,https://apex-web-admin-49qp.onrender.com,https://apex-p2p-panel.onrender.com,https://surrat.in,https://www.surrat.in,https://*.surrat.in
      - key: DATABASE_URL
        fromDatabase:
          name: apex-arcade-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: apex-arcade-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PHONE
        value: "9000001111"
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: apex-web-landing
    runtime: static
    autoDeployTrigger: commit
    buildCommand: npm ci && npm --workspace=apps/web-landing run build
    staticPublishPath: apps/web-landing/dist
    headers:
      - path: /downloads/*.apk
        name: Content-Type
        value: application/vnd.android.package-archive
      - path: /downloads/*.apk
        name: Content-Disposition
        value: attachment
      - path: /downloads/*.apk
        name: Cache-Control
        value: public, max-age=300
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: VITE_API_URL
        value: https://apex-arcade-api.onrender.com
      - key: VITE_PLAYER_URL
        value: https://apex-mobile-app.onrender.com
      # Signed release APK served from apps/web-landing/public/downloads (never a debug build).
      - key: VITE_APP_DOWNLOAD_URL
        value: /downloads/apex-arcade-1.1.apk
      - key: VITE_APP_VERSION
        value: "1.1"

  - type: web
    name: apex-mobile-app
    runtime: static
    autoDeployTrigger: commit
    buildCommand: npm ci && npm --workspace=apps/mobile-app run build
    staticPublishPath: apps/mobile-app/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: VITE_API_URL
        value: https://apex-arcade-api.onrender.com
      - key: VITE_ENABLE_DEMO_LOGIN
        value: "false"

  - type: web
    name: apex-web-admin
    runtime: static
    autoDeployTrigger: commit
    buildCommand: npm ci && npm --workspace=apps/web-admin run build
    staticPublishPath: apps/web-admin/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: VITE_API_URL
        value: https://apex-arcade-api.onrender.com

  - type: web
    name: apex-p2p-panel
    runtime: static
    autoDeployTrigger: commit
    buildCommand: npm ci && npm --workspace=apps/p2p-panel run build
    staticPublishPath: apps/p2p-panel/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: VITE_API_URL
        value: https://apex-arcade-api.onrender.com
